<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bourrée bancale à six</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header><h1><select id="dance" aria-label="Dance"><option value="bourree">Bourrée bancale</option><option value="chapelloise">Chapelloise</option><option value="cercle">Cercle circassien</option></select></h1><div id="pairs-control" hidden><button id="remove-pair" aria-label="Remove pair">−</button><span><output id="pair-count">5</output> pairs</span><button id="add-pair" aria-label="Add pair">+</button></div></header>
      <svg viewBox="-210 -200 420 400" role="img" aria-label="Six dancers approach in lines and change chains during each approach. Then edge dancers pass each other around a square while the two middle dancers advance, turn right and retreat.">
        <g id="guides"></g>
        <path class="center" d="M -5 0 H 5 M 0 -5 V 5" />
        <g id="hands"></g>
        <g id="dancers"></g>
      </svg>
      <div id="timeline">
        <nav id="sections" aria-label="Dance sections"></nav>
        <div id="track">
          <div id="elapsed"></div>
          <div id="ticks" aria-hidden="true"></div>
          <div id="playhead" aria-hidden="true"></div>
          <input id="scrub" aria-label="Dance timeline: two sections, four phrases per section, four steps per phrase" type="range" min="0" max="8" step="0.001" value="0" />
        </div>
        <div id="phrases" aria-label="Seek to phrase"></div>
      </div>
      <div class="controls">
        <button id="play" type="button">Pause</button>
        <button id="reset" type="button">Reset</button>
        <label class="letters-toggle"><input id="letters" type="checkbox" /> Letters</label>
        <select id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      </div>
      <p class="note" id="dance-note"></p>
      <div id="chaos-control" hidden><label for="chaos">Chaos <output id="chaos-value" for="chaos">0%</output></label><input id="chaos" type="range" min="0" max="100" step="5" value="0" aria-describedby="chaos-hint" /><span id="chaos-hint">Chance a crossing pair bounces back. Changes apply to new encounters.</span></div>
      <p id="roles" class="note" hidden><span class="role-key leader"></span> Leader <span class="role-key follower"></span> Follower</p>
      <details><summary>Notation &amp; sources</summary><p>The small tick shows facing; two circles inside each dancer suggest weight support. Paths and weight are schematic. 96 beats/min at 1×.<br><span id="sources"></span></p></details>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
