<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Balfolk Molecules</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <aside id="sidebar" aria-label="Dance library">
      <div class="sidebar-header">
        <button id="sidebar-toggle" type="button" aria-controls="dance-navigation" aria-expanded="true" aria-label="Collapse dance list"><span aria-hidden="true">☰</span></button>
        <span id="sidebar-label">Dances</span>
      </div>
      <nav id="dance-navigation" aria-label="Choose a dance"></nav>
    </aside>
    <main>
      <section class="player" aria-labelledby="dance-title">
      <header class="player-header"><h1 id="dance-title"></h1><div class="formation-controls"><p id="roles" hidden><span class="role-key leader"></span> Leader <span class="role-key follower"></span> Follower</p><div id="pairs-control" hidden><button id="remove-pair" type="button" aria-label="Remove pair">−</button><span><output id="pair-count">5</output> pairs</span><button id="add-pair" type="button" aria-label="Add pair">+</button></div></div></header>
      <div class="floor-area">
      <svg id="dance-floor" viewBox="-210 -200 420 400" role="img" aria-label="Six dancers approach in lines and change chains during each approach. Then edge dancers pass each other around a square while the two middle dancers advance, turn right and retreat.">
        <g id="guides"></g>
        <path class="center" d="M -5 0 H 5 M 0 -5 V 5" />
        <g id="hands"></g>
        <g id="dancers"></g>
      </svg>
      <p id="dance-status" role="status" hidden>Rearranging…</p>
      </div>
      <section class="playback" aria-label="Playback controls">
      <div id="timeline-scroll"><div id="timeline">
        <nav id="sections" aria-label="Dance sections"></nav>
        <div id="phrase-structure" hidden><div id="phrase-score"></div></div>
        <div id="track">
          <div id="elapsed"></div>
          <div id="ticks" aria-hidden="true"></div>
          <div id="playhead" aria-hidden="true"></div>
          <input id="scrub" aria-label="Dance timeline: two sections, four phrases per section, four steps per phrase" type="range" min="0" max="8" step="0.001" value="0" />
        </div>
      </div>
      </div>
      <div class="player-bottom">
      <div class="dance-tools">
      <div class="controls">
        <div class="transport">
          <button id="play" type="button">Pause</button>
          <button id="reset" type="button" aria-label="Restart" title="Restart">Restart</button>
        </div>
        <label class="tempo-control"><input id="tempo" type="range" min="0" max="1000" step="1" aria-label="Tempo" /><span><output id="tempo-value" for="tempo">90</output> BPM</span></label>
        <div class="display-controls">

          <div class="view-settings">
            <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel" aria-label="Settings" title="Settings">⚙</button>
            <div id="settings-panel" hidden>
              <label><input id="letters" type="checkbox" /> Dancer labels</label>
              <label><input id="show-steps" type="checkbox" checked /> Weight dots</label>
              <label><input id="show-structure" type="checkbox" checked /> Phrase detail</label>
              <a id="source-reference" target="_blank" rel="noreferrer">Source ↗</a>
            </div>
          </div>
        </div>
      </div>
      <div id="chaos-control" hidden><label for="chaos">Chaos <output id="chaos-value" for="chaos">0%</output></label><input id="chaos" type="range" min="0" max="100" step="5" value="0" aria-describedby="chaos-hint" /><span id="chaos-hint">Chance a crossing pair bounces back. Changes apply to new encounters.</span></div>

      <footer class="dance-reference">
        <div class="reference-copy">
        <div class="reference-heading">
          <h2 id="dance-names"></h2><p id="dance-aliases"></p>
        </div>
        <p id="dance-origin"></p>
        <nav id="dance-materials" aria-label="Dance references"></nav>
        </div>
      </footer>
      </div>
        <section id="music-panel" aria-label="Music" hidden>
          <div class="music-heading">
            <select id="music-recording" aria-label="Recording"><option value="">No music</option></select>
          </div>
          <div id="youtube-player"></div>
          <p id="music-status" role="status"></p>
        </section>
      </div>
      </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
